apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: fcg
spec:
  replicas: 2
  # Zero downtime no deploy: o pod novo precisa ficar Ready antes de um antigo sair.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: users-api }
  template:
    metadata:
      labels: { app: users-api }
    spec:
      # No EKS esta ServiceAccount recebe a role IAM via Pod Identity (sns:Publish);
      # ver infra/cloudformation/pod-identity.yaml.
      serviceAccountName: users-api
      containers:
        - name: users-api
          image: fcg/users-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom: { configMapKeyRef: { name: fcg-config, key: ASPNETCORE_ENVIRONMENT } }
            - name: JwtSettings__ExpirationHours
              valueFrom: { configMapKeyRef: { name: fcg-config, key: JwtSettings__ExpirationHours } }
            # Claim `iss` emitida no token; o gateway (Kong) valida este valor.
            - name: JwtSettings__Issuer
              valueFrom: { configMapKeyRef: { name: fcg-config, key: JWT_ISSUER } }
            # UserRegisteredEvent vai por SNS (consumido pela Lambda do NotificationsAPI).
            - name: Sns__TopicArn
              valueFrom: { configMapKeyRef: { name: fcg-config, key: Sns__UserEventsTopicArn } }
            - name: AWS_REGION
              valueFrom: { configMapKeyRef: { name: fcg-config, key: AWS_REGION } }
            # Opcional: so o Minikube usa access key (scripts/k8s/secrets.sh). No EKS o
            # fcg-secrets nao tem estas chaves e o SDK usa a credencial do Pod Identity.
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: AWS_ACCESS_KEY_ID, optional: true } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: AWS_SECRET_ACCESS_KEY, optional: true } }
            - name: JwtSettings__SecretKey
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: JwtSettings__SecretKey } }
            # Senha do admin raiz (seed no primeiro start). Opcional: sem ela o admin nao e criado.
            - name: Seed__AdminPassword
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: Seed__AdminPassword, optional: true } }
            - name: ConnectionStrings__DefaultConnection
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: Users__ConnectionString } }
            # Cache de usuarios (k8s/12-redis.yaml). Sem esta variavel o app tenta
            # localhost:6379 e o cache nunca funciona no cluster.
            - name: ConnectionStrings__Redis
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: Users__RedisConnection } }
            # Ativa o profiler do CLR. Sem estas 4 variaveis o pacote NewRelic.Agent
            # fica instalado em /app/newrelic mas NUNCA e carregado (agente inerte).
            # O GUID precisa de aspas: sem elas o YAML leria {..} como um mapa.
            - name: CORECLR_ENABLE_PROFILING
              value: "1"
            - name: CORECLR_PROFILER
              value: "{36032161-FFC0-4B61-B559-F6C5D41BAE5A}"
            - name: CORECLR_NEWRELIC_HOME
              value: /app/newrelic
            - name: CORECLR_PROFILER_PATH
              value: /app/newrelic/libNewRelicProfiler.so
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom: { secretKeyRef: { name: new-relic, key: license-key } }
            - name: NEW_RELIC_APP_NAME
              value: "FIAPCloudGames-fase3-UsersAPI"
            - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
              value: "true"
          # Usuários não expõe /health: sonda TCP na porta 8080.
          # Requests dimensionados para caber em 2 nodes c7i-flex.large (EKS, 4 GiB cada) com folga para o
          # maxSurge; sem limite de CPU para nao estrangular o startup do .NET.
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          # Zero downtime: ao sair, o pod espera 5s antes de parar. Da tempo do Service tirar
          # o pod da lista (endpoints) antes de ele recusar conexoes. Sleep nativo (k8s >= 1.30).
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
  namespace: fcg
spec:
  type: ClusterIP
  selector: { app: users-api }
  ports:
    - port: 8080
      targetPort: 8080
