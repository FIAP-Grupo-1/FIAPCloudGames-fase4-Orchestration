apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "fcg"
            # Mesma senha que catalog/payments usam (fcg-secrets: Minikube pelo 02-secret.yaml,
            # EKS pelo External Secrets a partir do Secrets Manager).
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: RabbitMq__Password } }
          ports:
            - containerPort: 5672
            - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: fcg
spec:
  selector: { app: rabbitmq }
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
