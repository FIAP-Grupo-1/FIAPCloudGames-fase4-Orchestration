# Somente EKS (aplicado pelo `make cluster-up`; o `kubectl apply -f k8s/` do Minikube nao
# entra nesta pasta). Cluster EKS novo nao tem StorageClass padrao, e sem ela o PVC do
# Postgres (k8s/11-postgres.yaml, sem storageClassName) fica em Pending para sempre.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
# Delete: o volume some junto com o PVC (o cluster-down apaga o namespace antes da stack).
reclaimPolicy: Delete
# Cria o volume na AZ do node que recebeu o pod.
volumeBindingMode: WaitForFirstConsumer
