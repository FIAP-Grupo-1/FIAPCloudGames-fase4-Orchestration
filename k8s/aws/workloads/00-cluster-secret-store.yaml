# So no EKS (aplicado por scripts/aws/deploy-workloads.sh, depois do Helm do ESO).
# Fica fora de k8s/aws/ porque o `cluster-up` aplica aquela pasta antes de existir
# o CRD do External Secrets.
#
# Sem bloco `auth`: o controller do ESO usa a credencial padrao do pod, que no EKS
# vem do Pod Identity (role fcg-eks-external-secrets, so leitura de fcg/eks/*).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
