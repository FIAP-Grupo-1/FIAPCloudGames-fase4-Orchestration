# Monta no EKS os MESMOS Secrets que o Minikube recebe do k8s/02-secret.yaml e do
# k8s/04-new-relic-secret.yaml (mesmos nomes e chaves), entao os Deployments nao
# mudam. Os valores vem do Secrets Manager (infra/cloudformation/workload-access.yaml)
# e nunca passam pelo repositorio.
#
# Sem AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY de proposito: no EKS o users-api e o
# payments-api publicam no SNS com a role do Pod Identity.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fcg-secrets
  namespace: fcg
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: fcg-secrets
    creationPolicy: Owner
    # As connection strings sao montadas aqui a partir de usuario/senha, para a
    # senha existir num lugar so (o segredo de cada servico).
    template:
      engineVersion: v2
      data:
        Users__ConnectionString: "Host=postgres;Port=5432;Database=fcgdb;Username={{ .pgUser }};Password={{ .pgPassword }}"
        Catalog__ConnectionString: "Host=postgres;Database=catalogdb;Username={{ .pgUser }};Password={{ .pgPassword }}"
        Payments__ConnectionString: "Host=postgres;Database=paymentsdb;Username={{ .pgUser }};Password={{ .pgPassword }}"
        Postgres__Password: "{{ .pgPassword }}"
        Catalog__RedisConnection: "redis:6379,user={{ .redisUser }},password={{ .redisPassword }},abortConnect=false"
        Users__RedisConnection: "redis:6379,user={{ .redisUser }},password={{ .redisPassword }},abortConnect=false"
        Redis__Password: "{{ .redisPassword }}"
        RabbitMq__Password: "{{ .rabbitPassword }}"
        JwtSettings__SecretKey: "{{ .jwtSecretKey }}"
  data:
    - secretKey: pgUser
      remoteRef: { key: fcg/eks/postgres, property: username }
    - secretKey: pgPassword
      remoteRef: { key: fcg/eks/postgres, property: password }
    - secretKey: redisUser
      remoteRef: { key: fcg/eks/redis, property: username }
    - secretKey: redisPassword
      remoteRef: { key: fcg/eks/redis, property: password }
    - secretKey: rabbitPassword
      remoteRef: { key: fcg/eks/rabbitmq, property: password }
    - secretKey: jwtSecretKey
      remoteRef: { key: fcg/eks/jwt, property: secretKey }
---
# License key do New Relic: reaproveita o segredo (texto puro) que a Lambda do
# NotificationsAPI ja usa desde a fase 3.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: new-relic
  namespace: fcg
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: new-relic
    creationPolicy: Owner
  data:
    - secretKey: license-key
      remoteRef: { key: fcg/notifications/new-relic-license-key }
