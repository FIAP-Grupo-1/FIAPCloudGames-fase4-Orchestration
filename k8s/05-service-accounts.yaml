# ServiceAccounts das APIs que publicam no SNS. No Minikube sao so contas comuns
# (a credencial vem da access key do .env); no EKS cada uma recebe a sua IAM Role
# via Pod Identity (infra/cloudformation/pod-identity.yaml), sem access key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: users-api
  namespace: fcg
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-api
  namespace: fcg
---
# catalog-api: no EKS assina as chamadas ao Amazon OpenSearch (busca de jogos) com a
# role fcg-eks-catalog-api. No Minikube a busca fica desligada (Search__Enabled ausente).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-api
  namespace: fcg
