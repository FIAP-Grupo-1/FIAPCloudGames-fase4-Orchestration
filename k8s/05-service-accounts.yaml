# ServiceAccounts das APIs que publicam no SNS. No Minikube sao so contas comuns
# (a credencial vem da access key do .env); no EKS cada uma recebe a sua IAM Role
# via Pod Identity (infra/cloudformation/pod-identity.yaml), sem access key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: users-api
  namespace: fcg
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-api
  namespace: fcg
