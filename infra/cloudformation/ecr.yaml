AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
Description: >
  FCG - repositórios ECR privados das imagens dos microsserviços (registry nativo
  da cloud exigido pelo Tech Challenge Fase 4). Um repositório por serviço,
  gerado a partir da lista em ServiceNames.

Parameters:
  ServiceNames:
    Type: CommaDelimitedList
    Default: users-api,catalog-api,payments-api
    Description: >
      Serviços que ganham repositório (fcg/<serviço>). O NotificationsAPI fica de fora:
      na AWS ele roda como Lambda empacotada em zip, sem imagem.
  DevImageRetentionDays:
    Type: Number
    Default: 15
    MinValue: 1
    Description: >
      Dias até expirar imagens sem tag e imagens com tag de dev/CI (dev-*, pr-*,
      feature-*, sha-*). Tags de release (v*, prod-*, release-*) nunca expiram.
  ImageTagMutability:
    Type: String
    Default: IMMUTABLE
    AllowedValues: [IMMUTABLE, MUTABLE]
    Description: >
      IMMUTABLE impede sobrescrever uma tag já publicada (a pipeline deve taggear por
      commit SHA/versão, não reutilizar "latest").

Resources:
  Fn::ForEach::Repositories:
    - Service
    - !Ref ServiceNames
    - 'Repo&{Service}':
        Type: AWS::ECR::Repository
        Properties:
          RepositoryName: !Sub 'fcg/${Service}'
          ImageTagMutability: !Ref ImageTagMutability
          ImageScanningConfiguration:
            ScanOnPush: true
          EncryptionConfiguration:
            EncryptionType: AES256
          # Só expira o que casa explicitamente com tags de dev/CI ou está sem tag; o resto
          # (v*, prod-*, release-*) nunca é tocado. O ECR não tem "expirar tudo exceto X", então
          # um formato novo de tag de dev precisa de regra própria aqui, senão acumula.
          # Uma regra por padrão: com vários itens no tagPatternList, o ECR só seleciona imagens
          # que tenham TODAS as tags (AND), não qualquer uma delas.
          LifecyclePolicy:
            LifecyclePolicyText: !Sub |
              {
                "rules": [
                  {
                    "rulePriority": 1,
                    "description": "Limpa imagens sem tag após ${DevImageRetentionDays} dias",
                    "selection": {
                      "tagStatus": "untagged",
                      "countType": "sinceImagePushed",
                      "countUnit": "days",
                      "countNumber": ${DevImageRetentionDays}
                    },
                    "action": { "type": "expire" }
                  },
                  {
                    "rulePriority": 2,
                    "description": "Expira tags dev-* após ${DevImageRetentionDays} dias",
                    "selection": {
                      "tagStatus": "tagged",
                      "tagPatternList": ["dev-*"],
                      "countType": "sinceImagePushed",
                      "countUnit": "days",
                      "countNumber": ${DevImageRetentionDays}
                    },
                    "action": { "type": "expire" }
                  },
                  {
                    "rulePriority": 3,
                    "description": "Expira tags pr-* após ${DevImageRetentionDays} dias",
                    "selection": {
                      "tagStatus": "tagged",
                      "tagPatternList": ["pr-*"],
                      "countType": "sinceImagePushed",
                      "countUnit": "days",
                      "countNumber": ${DevImageRetentionDays}
                    },
                    "action": { "type": "expire" }
                  },
                  {
                    "rulePriority": 4,
                    "description": "Expira tags feature-* após ${DevImageRetentionDays} dias",
                    "selection": {
                      "tagStatus": "tagged",
                      "tagPatternList": ["feature-*"],
                      "countType": "sinceImagePushed",
                      "countUnit": "days",
                      "countNumber": ${DevImageRetentionDays}
                    },
                    "action": { "type": "expire" }
                  },
                  {
                    "rulePriority": 5,
                    "description": "Expira tags sha-* após ${DevImageRetentionDays} dias",
                    "selection": {
                      "tagStatus": "tagged",
                      "tagPatternList": ["sha-*"],
                      "countType": "sinceImagePushed",
                      "countUnit": "days",
                      "countNumber": ${DevImageRetentionDays}
                    },
                    "action": { "type": "expire" }
                  }
                ]
              }
          Tags:
            - Key: project
              Value: fcg
            - Key: service
              Value: !Ref Service

Outputs:
  RegistryUri:
    Description: Endereço do registry (usado no docker login e no prefixo das imagens).
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com'
    Export:
      Name: fcg-ecr-registry-uri
  Fn::ForEach::RepositoryUris:
    - Service
    - !Ref ServiceNames
    - 'Repo&{Service}Uri':
        Description: !Sub 'URI do repositório de ${Service}'
        Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/fcg/${Service}'
        Export:
          Name: !Sub 'fcg-ecr-${Service}-uri'
