AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
Description: >
  FCG - acesso do GitHub Actions à AWS via OIDC, sem access key guardada no GitHub.
  Cria o Identity Provider do GitHub e uma IAM Role por repositório de serviço,
  que só pode publicar imagens no repositório ECR do próprio serviço e ler o
  endereço do cluster EKS para o deploy (o que pode fazer dentro dele é a access
  entry do eks.yaml).

Parameters:
  ServiceRepos:
    Type: CommaDelimitedList
    Default: UsersAPI,CatalogAPI,PaymentsAPI
    Description: >
      Sufixo dos repositórios FIAPCloudGames-fase4-<sufixo> que ganham role. Cada um
      precisa de uma entrada em Mappings.EcrRepository (com o RepoId: gh api repos/<org>/<repo> --jq .id).
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      O provider OIDC do GitHub é único por conta. Use false se ele já existir
      (criado por outra stack ou à mão).

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

# Dono e IDs ficam em Mappings, não em Parameters: num update, o `aws cloudformation deploy`
# reaproveita o valor atual de todo parâmetro não informado, então mudar o Default de um
# parâmetro não teria efeito na stack existente. Mudou aqui, muda no próximo deploy.
Mappings:
  # Dono dos repositórios. Com subject imutável, o "sub" do token leva o nome E o ID do dono:
  # transferir os repos de dono (como na ida para a org FIAP-Grupo-1) exige atualizar os dois.
  # ID: gh api users/<dono> --jq .id
  GitHub:
    Owner:
      Name: FIAP-Grupo-1
      Id: '350507928'
  EcrRepository:
    UsersAPI:
      Name: fcg/users-api
      RoleName: fcg-gha-users-api
      RepoId: '1427736701'
    CatalogAPI:
      Name: fcg/catalog-api
      RoleName: fcg-gha-catalog-api
      RepoId: '1427734632'
    PaymentsAPI:
      Name: fcg/payments-api
      RoleName: fcg-gha-payments-api
      RepoId: '1427737598'

  # NotificationsAPI nao tem imagem: e uma Lambda publicada pelo SAM (sam deploy).
  Notifications:
    Repo:
      Name: FIAPCloudGames-fase4-NotificationsAPI
      Id: '1427732422'
      Stack: fcg-notifications-serverless

  # Nome do cluster EKS (ClusterName do eks.yaml / CLUSTER_NAME do cluster-up.sh).
  # O contexto do kubectl se chama fcg-eks, mas o cluster na AWS é "fcg".
  Eks:
    Cluster:
      Name: fcg

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  Fn::ForEach::PushRoles:
    - Repo
    - !Ref ServiceRepos
    - 'PushRole${Repo}':
        Type: AWS::IAM::Role
        Properties:
          RoleName: !FindInMap [EcrRepository, !Ref Repo, RoleName]
          Description: !Sub 'GitHub Actions de FIAPCloudGames-fase4-${Repo}: push no ECR'
          MaxSessionDuration: 3600
          # Quem pode assumir: só o repositório exato, e só a partir da main ou de tags v*.
          # PRs (inclusive de forks) ficam de fora: o "sub" deles termina em :pull_request.
          #
          # Os repositórios usam subject imutável (use_immutable_subject no GitHub), então o
          # "sub" leva o ID numérico do dono e do repo: repo:<org>@<id>/<repo>@<id>:ref:...
          # Um repo apagado e recriado com o mesmo nome ganha outro ID e não herda o acesso.
          # Para conferir o formato: gh api repos/<org>/<repo>/actions/oidc/customization/sub
          AssumeRolePolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Principal:
                  Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
                Action: sts:AssumeRoleWithWebIdentity
                Condition:
                  StringEquals:
                    token.actions.githubusercontent.com:aud: sts.amazonaws.com
                  StringLike:
                    token.actions.githubusercontent.com:sub:
                      - !Sub
                        - 'repo:${Owner}@${OwnerId}/FIAPCloudGames-fase4-${Repo}@${RepoId}:ref:refs/heads/main'
                        - Owner: !FindInMap [GitHub, Owner, Name]
                          OwnerId: !FindInMap [GitHub, Owner, Id]
                          RepoId: !FindInMap [EcrRepository, !Ref Repo, RepoId]
                      - !Sub
                        - 'repo:${Owner}@${OwnerId}/FIAPCloudGames-fase4-${Repo}@${RepoId}:ref:refs/tags/v*'
                        - Owner: !FindInMap [GitHub, Owner, Name]
                          OwnerId: !FindInMap [GitHub, Owner, Id]
                          RepoId: !FindInMap [EcrRepository, !Ref Repo, RepoId]
          Policies:
            - PolicyName: ecr-push
              PolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Action: ecr:GetAuthorizationToken
                    Resource: '*'
                  - Effect: Allow
                    Action:
                      - ecr:BatchCheckLayerAvailability
                      - ecr:InitiateLayerUpload
                      - ecr:UploadLayerPart
                      - ecr:CompleteLayerUpload
                      - ecr:PutImage
                      # o workflow confere se a tag já existe (tags são IMMUTABLE)
                      - ecr:DescribeImages
                      # o docker push faz HEAD no manifest/blobs antes de gravar; sem
                      # essas leituras o push termina em 403 depois de subir as camadas
                      - ecr:BatchGetImage
                      - ecr:GetDownloadUrlForLayer
                    Resource: !Sub
                      - 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepo}'
                      - EcrRepo: !FindInMap [EcrRepository, !Ref Repo, Name]
            # Deploy pela pipeline: o `aws eks update-kubeconfig` lê endpoint e CA do
            # cluster. Só leitura e só deste cluster; dentro do Kubernetes a role
            # edita apenas o namespace fcg (CiAccessEntry no eks.yaml).
            - PolicyName: eks-deploy
              PolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Action: eks:DescribeCluster
                    Resource: !Sub
                      - 'arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}'
                      - ClusterName: !FindInMap [Eks, Cluster, Name]

  # ---------- NotificationsAPI (Lambda): deploy pela pipeline com `sam deploy` ----------
  # Duas roles, para a do GitHub nao precisar de poder sobre IAM/Lambda/SQS:
  #   - fcg-gha-notifications: o que o GitHub Actions assume. So envia o pacote para o
  #     bucket do SAM e pede ao CloudFormation o change set da stack da Lambda.
  #   - fcg-cfn-notifications: role de servico que o CloudFormation usa para aplicar o
  #     change set, limitada aos recursos fcg-notifications* da stack.
  NotificationsCfnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: fcg-cfn-notifications
      Description: CloudFormation aplica a stack fcg-notifications-serverless (deploy da pipeline)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: notifications-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:fcg-notifications-*'
              # Event source mapping (SQS -> Lambda) nao aceita filtro por nome da funcao.
              - Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:ListEventSourceMappings
                Resource: '*'
              # Roles das funcoes, geradas pelo SAM com o prefixo do nome da stack.
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:GetRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/fcg-notifications-serverl*'
              - Effect: Allow
                Action: sqs:*
                Resource: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:fcg-notifications-*'
              - Effect: Allow
                Action: sns:*
                Resource:
                  - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:fcg-user-events*'
                  - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:fcg-payment-events*'
              - Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/fcg-notifications'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/fcg-notifications/*'
              # {{resolve:secretsmanager:...}} da license key do New Relic no template.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:fcg/notifications/*'
              # Com role de servico, o CloudFormation processa o transform do SAM com ela.
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              # O SAM le o pacote da funcao no bucket gerenciado dele.
              - Effect: Allow
                Action: s3:GetObject
                Resource: 'arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*'

  NotificationsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: fcg-gha-notifications
      Description: GitHub Actions de FIAPCloudGames-fase4-NotificationsAPI - sam deploy da Lambda
      MaxSessionDuration: 3600
      # So a main do repositorio exato (subject imutavel, mesmo formato das roles acima).
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub
                  - 'repo:${Owner}@${OwnerId}/${RepoName}@${RepoId}:ref:refs/heads/main'
                  - Owner: !FindInMap [GitHub, Owner, Name]
                    OwnerId: !FindInMap [GitHub, Owner, Id]
                    RepoName: !FindInMap [Notifications, Repo, Name]
                    RepoId: !FindInMap [Notifications, Repo, Id]
      Policies:
        - PolicyName: sam-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                Resource:
                  - !Sub
                    - 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Stack}/*'
                    - Stack: !FindInMap [Notifications, Repo, Stack]
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*'
              # O template usa o transform do SAM (AWS::Serverless-2016-10-31).
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - 'arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*'
                  - 'arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*'
              # Resumo do deploy: versao para a qual o alias prod aponta.
              - Effect: Allow
                Action: lambda:GetAlias
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:fcg-notifications-*'
              # Entrega a role de servico ao CloudFormation (sam deploy --role-arn).
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt NotificationsCfnRole.Arn

Outputs:
  NotificationsDeployRoleArn:
    Description: Valor da variavel AWS_ROLE_ARN no repositorio FIAPCloudGames-fase4-NotificationsAPI
    Value: !GetAtt NotificationsDeployRole.Arn
  NotificationsCfnRoleArn:
    Description: Valor da variavel CFN_ROLE_ARN no repositorio FIAPCloudGames-fase4-NotificationsAPI
    Value: !GetAtt NotificationsCfnRole.Arn
  Fn::ForEach::RoleArns:
    - Repo
    - !Ref ServiceRepos
    - 'PushRole${Repo}Arn':
        Description: !Sub 'Valor da variável AWS_ROLE_ARN no repositório FIAPCloudGames-fase4-${Repo}'
        Value: !Sub
          - 'arn:aws:iam::${AWS::AccountId}:role/${RoleName}'
          - RoleName: !FindInMap [EcrRepository, !Ref Repo, RoleName]
