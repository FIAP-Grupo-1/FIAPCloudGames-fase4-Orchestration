AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
Description: >
  FCG - acesso do GitHub Actions à AWS via OIDC, sem access key guardada no GitHub.
  Cria o Identity Provider do GitHub e uma IAM Role por repositório de serviço,
  que só pode publicar imagens no repositório ECR do próprio serviço e ler o
  endereço do cluster EKS para o deploy (o que pode fazer dentro dele é a access
  entry do eks.yaml).

Parameters:
  ServiceRepos:
    Type: CommaDelimitedList
    Default: UsersAPI,CatalogAPI,PaymentsAPI
    Description: >
      Sufixo dos repositórios FIAPCloudGames-fase4-<sufixo> que ganham role. Cada um
      precisa de uma entrada em Mappings.EcrRepository (com o RepoId: gh api repos/<org>/<repo> --jq .id).
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      O provider OIDC do GitHub é único por conta. Use false se ele já existir
      (criado por outra stack ou à mão).

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

# Dono e IDs ficam em Mappings, não em Parameters: num update, o `aws cloudformation deploy`
# reaproveita o valor atual de todo parâmetro não informado, então mudar o Default de um
# parâmetro não teria efeito na stack existente. Mudou aqui, muda no próximo deploy.
Mappings:
  # Dono dos repositórios. Com subject imutável, o "sub" do token leva o nome E o ID do dono:
  # transferir os repos de dono (como na ida para a org FIAP-Grupo-1) exige atualizar os dois.
  # ID: gh api users/<dono> --jq .id
  GitHub:
    Owner:
      Name: FIAP-Grupo-1
      Id: '350507928'
  EcrRepository:
    UsersAPI:
      Name: fcg/users-api
      RoleName: fcg-gha-users-api
      RepoId: '1427736701'
    CatalogAPI:
      Name: fcg/catalog-api
      RoleName: fcg-gha-catalog-api
      RepoId: '1427734632'
    PaymentsAPI:
      Name: fcg/payments-api
      RoleName: fcg-gha-payments-api
      RepoId: '1427737598'

  # Nome do cluster EKS (ClusterName do eks.yaml / CLUSTER_NAME do cluster-up.sh).
  # O contexto do kubectl se chama fcg-eks, mas o cluster na AWS é "fcg".
  Eks:
    Cluster:
      Name: fcg

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  Fn::ForEach::PushRoles:
    - Repo
    - !Ref ServiceRepos
    - 'PushRole${Repo}':
        Type: AWS::IAM::Role
        Properties:
          RoleName: !FindInMap [EcrRepository, !Ref Repo, RoleName]
          Description: !Sub 'GitHub Actions de FIAPCloudGames-fase4-${Repo}: push no ECR'
          MaxSessionDuration: 3600
          # Quem pode assumir: só o repositório exato, e só a partir da main ou de tags v*.
          # PRs (inclusive de forks) ficam de fora: o "sub" deles termina em :pull_request.
          #
          # Os repositórios usam subject imutável (use_immutable_subject no GitHub), então o
          # "sub" leva o ID numérico do dono e do repo: repo:<org>@<id>/<repo>@<id>:ref:...
          # Um repo apagado e recriado com o mesmo nome ganha outro ID e não herda o acesso.
          # Para conferir o formato: gh api repos/<org>/<repo>/actions/oidc/customization/sub
          AssumeRolePolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Principal:
                  Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
                Action: sts:AssumeRoleWithWebIdentity
                Condition:
                  StringEquals:
                    token.actions.githubusercontent.com:aud: sts.amazonaws.com
                  StringLike:
                    token.actions.githubusercontent.com:sub:
                      - !Sub
                        - 'repo:${Owner}@${OwnerId}/FIAPCloudGames-fase4-${Repo}@${RepoId}:ref:refs/heads/main'
                        - Owner: !FindInMap [GitHub, Owner, Name]
                          OwnerId: !FindInMap [GitHub, Owner, Id]
                          RepoId: !FindInMap [EcrRepository, !Ref Repo, RepoId]
                      - !Sub
                        - 'repo:${Owner}@${OwnerId}/FIAPCloudGames-fase4-${Repo}@${RepoId}:ref:refs/tags/v*'
                        - Owner: !FindInMap [GitHub, Owner, Name]
                          OwnerId: !FindInMap [GitHub, Owner, Id]
                          RepoId: !FindInMap [EcrRepository, !Ref Repo, RepoId]
          Policies:
            - PolicyName: ecr-push
              PolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Action: ecr:GetAuthorizationToken
                    Resource: '*'
                  - Effect: Allow
                    Action:
                      - ecr:BatchCheckLayerAvailability
                      - ecr:InitiateLayerUpload
                      - ecr:UploadLayerPart
                      - ecr:CompleteLayerUpload
                      - ecr:PutImage
                      # o workflow confere se a tag já existe (tags são IMMUTABLE)
                      - ecr:DescribeImages
                      # o docker push faz HEAD no manifest/blobs antes de gravar; sem
                      # essas leituras o push termina em 403 depois de subir as camadas
                      - ecr:BatchGetImage
                      - ecr:GetDownloadUrlForLayer
                    Resource: !Sub
                      - 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepo}'
                      - EcrRepo: !FindInMap [EcrRepository, !Ref Repo, Name]
            # Deploy pela pipeline: o `aws eks update-kubeconfig` lê endpoint e CA do
            # cluster. Só leitura e só deste cluster; dentro do Kubernetes a role
            # edita apenas o namespace fcg (CiAccessEntry no eks.yaml).
            - PolicyName: eks-deploy
              PolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Action: eks:DescribeCluster
                    Resource: !Sub
                      - 'arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}'
                      - ClusterName: !FindInMap [Eks, Cluster, Name]

Outputs:
  Fn::ForEach::RoleArns:
    - Repo
    - !Ref ServiceRepos
    - 'PushRole${Repo}Arn':
        Description: !Sub 'Valor da variável AWS_ROLE_ARN no repositório FIAPCloudGames-fase4-${Repo}'
        Value: !Sub
          - 'arn:aws:iam::${AWS::AccountId}:role/${RoleName}'
          - RoleName: !FindInMap [EcrRepository, !Ref Repo, RoleName]
